name: CI

# Runs on every pull request and every push to main. The Release workflow
# re-runs the full suite on the commit it publishes; this one catches a red
# main before anyone tries to release it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        if: runner.os != 'Windows'
        run: npm test
      - name: Test (Windows)
        # Hosted Windows runners are slow enough that full parallelism turns
        # the suite's 5s timeouts and file-handle limits into load-dependent
        # failures (#1773). Fewer workers and longer timeouts test the code,
        # not the runner.
        if: runner.os == 'Windows'
        run: npx vitest run --maxWorkers=2 --testTimeout=30000 --hookTimeout=60000

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build kernel (linux-x64)
        run: bash scripts/build-kernel.sh --target x86_64-unknown-linux-gnu
      - name: Kernel contract + walker-parity suites
        run: CODEGRAPH_KERNEL_EXPECT=1 npx vitest run __tests__/kernel-*.test.ts
